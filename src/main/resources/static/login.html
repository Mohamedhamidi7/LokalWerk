
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokalWerk | Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">LokalWerk</div>
    <div class="topbar-right">
      <button class="secondary" type="button" id="logoutButton">Logout</button>
    </div>
  </header>

  <main class="shell">
    <div class="layout">
      <aside class="sidebar">
        <nav class="nav-group">
          <button class="nav-btn" type="button" onclick="document.getElementById('overview').scrollIntoView({behavior:'smooth'})">Overview</button>
          <button class="nav-btn" type="button" onclick="document.getElementById('categoriesSection').scrollIntoView({behavior:'smooth'})">Categories</button>
          <button class="nav-btn" type="button" onclick="document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})">Products</button>
          <button class="nav-btn" type="button" onclick="document.getElementById('assignmentSection').scrollIntoView({behavior:'smooth'})">Assignments</button>
        </nav>
      </aside>

      <div class="content">
        <section class="panel" id="overview">
          <h2>Overview</h2>
          <div class="summary-grid">
            <div class="summary-card">
              <div class="label">Categories</div>
              <div class="value" id="totalCategories">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Products</div>
              <div class="value" id="totalProducts">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Available</div>
              <div class="value" id="availableProducts">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Categories with products</div>
              <div class="value" id="categoriesWithProducts">0</div>
            </div>
          </div>
        </section>

        <section class="panel" id="categoriesSection">
          <h2>Categories</h2>
          <form id="categoryForm">
            <div class="form-grid">
              <div class="field">
                <label for="categoryName">Name</label>
                <input id="categoryName" type="text" placeholder="Category name" />
              </div>
              <div class="field">
                <label for="categoryImage">Image</label>
                <input id="categoryImage" type="file" accept="image/*" />
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label for="categoryDescription">Description</label>
                <textarea id="categoryDescription" placeholder="Category description"></textarea>
              </div>
            </div>
            <div class="actions-row">
              <button class="primary" type="submit">Create Category</button>
            </div>
          </form>
          <p id="categoryMessage" class="message"></p>
          <div id="categoriesList" class="card-grid"></div>
        </section>

        <section class="panel" id="productsSection">
          <h2>Products</h2>
          <form id="productForm">
            <div class="form-grid">
              <div class="field">
                <label for="productName">Name</label>
                <input id="productName" type="text" placeholder="Product name" />
              </div>
              <div class="field">
                <label for="productImage">Image</label>
                <input id="productImage" type="file" accept="image/*" />
              </div>
              <div class="field">
                <label for="costPrice">Cost Price</label>
                <input id="costPrice" type="number" step="0.01" min="0" placeholder="0.00" />
              </div>
              <div class="field">
                <label for="price">Price</label>
                <input id="price" type="number" step="0.01" min="0" placeholder="0.00" />
              </div>
              <div class="field">
                <label for="available">Available</label>
                <select id="available">
                  <option value="true">true</option>
                  <option value="false">false</option>
                </select>
              </div>
              <div class="field">
                <label for="preorderAvailable">Preorder Available</label>
                <select id="preorderAvailable">
                  <option value="true">true</option>
                  <option value="false">false</option>
                </select>
              </div>
              <div class="field">
                <label for="categoryId">Category</label>
                <select id="categoryId">
                  <option value="">Select category</option>
                </select>
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label for="productDescription">Description</label>
                <textarea id="productDescription" placeholder="Product description"></textarea>
              </div>
            </div>
            <div class="actions-row">
              <button class="primary" type="submit">Create Product</button>
            </div>
          </form>
          <p id="productMessage" class="message"></p>
          <div id="productsList" class="card-grid"></div>
        </section>

        <section class="panel" id="editProductSection">
          <h2>Edit Product</h2>
          <form id="editProductForm">
            <input id="editProductId" type="hidden" />
            <div class="form-grid">
              <div class="field">
                <label for="editProductSelect">Choose Product</label>
                <select id="editProductSelect">
                  <option value="">Select product</option>
                </select>
              </div>
              <div class="field">
                <label for="editProductName">Name</label>
                <input id="editProductName" type="text" placeholder="Product name" />
              </div>
              <div class="field">
                <label for="editCostPrice">Cost Price</label>
                <input id="editCostPrice" type="number" step="0.01" min="0" placeholder="0.00" />
              </div>
              <div class="field">
                <label for="editPrice">Price</label>
                <input id="editPrice" type="number" step="0.01" min="0" placeholder="0.00" />
              </div>
              <div class="field">
                <label for="editAvailable">Available</label>
                <select id="editAvailable">
                  <option value="true">true</option>
                  <option value="false">false</option>
                </select>
              </div>
              <div class="field">
                <label for="editPreorderAvailable">Preorder Available</label>
                <select id="editPreorderAvailable">
                  <option value="true">true</option>
                  <option value="false">false</option>
                </select>
              </div>
              <div class="field">
                <label for="editCategoryId">Category</label>
                <select id="editCategoryId">
                  <option value="">Select category</option>
                </select>
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label for="editProductDescription">Description</label>
                <textarea id="editProductDescription" placeholder="Product description"></textarea>
              </div>
            </div>
            <div class="actions-row">
              <button class="primary" type="submit">Update Product</button>
            </div>
          </form>
          <p id="editProductMessage" class="message"></p>
        </section>

        <section class="panel" id="assignmentSection">
          <h2>Assign Product to Category</h2>
          <form id="productToCategoryForm">
            <div class="form-grid">
              <div class="field">
                <label for="addCategoryId">Category</label>
                <select id="addCategoryId">
                  <option value="">Select category</option>
                </select>
              </div>
              <div class="field">
                <label for="addProductId">Product</label>
                <select id="addProductId">
                  <option value="">Select product</option>
                </select>
              </div>
            </div>
            <div class="actions-row">
              <button class="primary" type="submit">Add Product to Category</button>
            </div>
          </form>
          <p id="addMessage" class="message"></p>
        </section>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LokalWerk - Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><div class="login-container">
<div class="login-logo"><div class="logo-box">L</div><h1>LokalWerk</h1></div>
<div class="login-card"><h2>Welcome back</h2><p class="subtitle">Sign in to manage your LokalWerk catalogue.</p>
<form id="loginForm"><div class="form-group"><label for="username">Username</label><input id="username" type="text" placeholder="test" required></div>
<div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="••••••••" required></div>
<p id="loginError" class="error-message"></p><button id="loginButton" class="btn-primary" type="submit">Sign in</button></form>
</div></div><script src="/js/auth.js"></script></body></html>

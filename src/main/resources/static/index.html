<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokalWerk | Login</title>
  <style>
    :root {
      --bg: #eef2ff;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --primary: #0f172a;
      --border: #e2e8f0;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--text);
    }

    .login-box {
      width: min(92vw, 420px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 1.7rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }

    button {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    #message {
      min-height: 1.5em;
      text-align: center;
      margin-top: 16px;
      font-weight: 700;
      color: var(--muted);
    }

    #message.error {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">LokalWerk</div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" />
    </div>

    <button type="button" onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <script>
    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!username || !password) {
        message.textContent = "Please enter username and password.";
        message.className = "error";
        return;
      }

      try {
        const response = await fetch("/index", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          message.textContent = "Login failed. Check your credentials.";
          message.className = "error";
          return;
        }

        const data = await response.json();
        localStorage.setItem("token", data.token);
        message.textContent = "";
        window.location.href = "/index.html";
      } catch (error) {
        message.textContent = "Unable to contact the server.";
        message.className = "error";
      }
    }

    if (localStorage.getItem("token")) {
      window.location.href = "/index.html";
    }
  </script>
</body>
</html>

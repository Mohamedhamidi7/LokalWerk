<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LokalWerk - Products</title><link rel="stylesheet" href="/css/style.css"></head>
<body><script src="/js/auth.js"></script><script>requireAuth();</script>
<div class="app"><aside class="sidebar"><div class="sidebar-logo"><div class="logo-box">L</div><h2>LokalWerk</h2></div>
<nav><a href="/dashboard.html">Dashboard</a><a class="active" href="/products.html">Products</a><a href="/categories.html">Categories</a></nav><button class="logout-btn" onclick="logout()">Logout</button></aside>
<main class="main-content"><header class="topbar"><div><h1>Products</h1><p>Manage your LokalWerk products.</p></div><button class="btn-primary small-btn" onclick="openCreateModal()">+ Add Product</button></header>
<div class="toolbar"><input id="searchInput" placeholder="Search products..."></div><section id="productsContainer" class="product-grid"></section></main></div>
<div id="productModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h2 id="modalTitle">Add Product</h2><button class="close-btn" onclick="closeModal()">×</button></div>
<form id="productForm"><div class="form-group"><label>Name</label><input id="productName" required></div><div class="form-group"><label>Description</label><textarea id="productDescription"></textarea></div>
<div class="form-row"><div class="form-group"><label>Cost Price</label><input id="productCostPrice" type="number" step="0.01" min="0" required></div><div class="form-group"><label>Selling Price</label><input id="productPrice" type="number" step="0.01" min="0" required></div></div>
<div class="form-group"><label>Category</label><select id="productCategory"><option value="">No category</option></select></div>
<div class="checkbox-group"><label><input id="productAvailable" type="checkbox" checked> Available</label></div>
<div class="checkbox-group"><label><input id="productPreorderAvailable" type="checkbox"> Preorder Available</label></div>
<div class="form-group"><label>Product Image</label><input id="productImage" type="file" accept="image/*"><small id="imageHint"></small></div>
<button class="btn-primary" type="submit">Save Product</button></form></div></div>
<script src="/js/products.js"></script></body></html>

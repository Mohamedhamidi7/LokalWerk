spring:
  application:
    name: Lokalwerk
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000

logging:
  level:
    org.springframework.security: DEBUG
supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
